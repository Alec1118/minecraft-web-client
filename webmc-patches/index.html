<!-- perf-adapt --><script>
/* AiAlec 设备自适应 v1 (2026-09-15)
   在 perf-auto 之上做「按这台机器算」：
   1) 读真实 GPU 型号（WEBGL_debug_renderer_info）→ 分类 software / integrated / discrete
   2) 进世界前先按 GPU 归类给一个初始 DPR 上限
   3) 进世界后做一次 10 秒帧率校准，按帧率中位数再微调，并把上限真正应用到渲染器
   诊断：__perfAdapt */
(function(){
  var A = window.__perfAdapt = {ver:'v1', gpu:'?', kind:'?', base:null, cap:null, calib:null, applied:0, renderer:'?', notes:[]};

  function probeGL(){
    var out={gpu:'?',kind:'unknown',ver:'?'};
    try{
      var c=document.createElement('canvas');
      var gl=c.getContext('webgl2')||c.getContext('webgl');
      if(!gl){ out.kind='none'; return out; }
      var ext=gl.getExtension('WEBGL_debug_renderer_info');
      out.gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '(no debug ext)';
      out.ver = String(gl.getParameter(gl.VERSION)||'').slice(0,40);
      out.kind = /swiftshader|llvmpipe|softwarerasterizer|software|basic render|mesa offscreen|virtualbox|vmware/i.test(out.gpu) ? 'software'
               : /nvidia|geforce|rtx|gtx|quadro|radeon rx|radeon pro|arc a\d|apple m\d/i.test(out.gpu) ? 'discrete'
               : /intel|uhd|iris|hd graphics|vega|radeon graphics|mali|adreno|powervr|apple gpu/i.test(out.gpu) ? 'integrated'
               : 'unknown';
      try{ var l=gl.getExtension('WEBGL_lose_context'); if(l) l.loseContext(); }catch(e){}
    }catch(e){ out.gpu='err:'+e.message; }
    return out;
  }
  var DP=window.__devProfile||{};
  A.probe = {gpu:DP.gpu||'?',kind:DP.kind||'unknown',ver:DP.glVer||'?'};
  A.gpu = A.probe.gpu; A.kind = A.probe.kind;

  var _dc=(window.__devProfile&&window.__devProfile.dprCap)||1;
  var KIND_CAP = { software:_dc, none:_dc, integrated:_dc, unknown:_dc, discrete:_dc }; /* v28: 统一画像，消除多套 DPR 打架 */
  function setCap(v){
    try{ A.cap=v; if(window.__perfAutoSetCap) window.__perfAutoSetCap(v); A.applied++; }catch(e){}
  }
  function applyToRenderer(){
    var v=Math.min(window.devicePixelRatio||1,_dc), used='none', cands=[]; /* v28: 按设备画像 */
    try{ if(window.renderer) cands.push(window.renderer); }catch(e){}
    try{ if(window.appViewer&&window.appViewer.worldView) cands.push(window.appViewer.worldView); }catch(e){}
    for(var i=0;i<cands.length;i++){
      var r=cands[i];
      if(r&&typeof r.setPixelRatio==='function'){
        try{ r.setPixelRatio(v); used=(r.type||'renderer'); break; }catch(e){}
      }
    }
    A.renderer=used; return used;
  }

  // ① 进世界前先定初始上限（渲染器创建时会读 window.devicePixelRatio）
  var iv=setInterval(function(){
    if(window.__perfAuto && A.base===null){ A.base = window.__perfAuto.dprCap; }
    if(window.__perfAutoSetCap){
      setCap(KIND_CAP[A.kind]);
      A.notes.push('初始上限 ' + KIND_CAP[A.kind] + '（GPU 类型 ' + A.kind + '）');
      clearInterval(iv);
    }
  }, 120);

  // ② 进世界后 10 秒校准（r47：必须等 bundle "All chunks done and ready" 再校准——
  //    加载期校准会取到假低值(实测 29.9fps)；兜底：等不到就进世界 150s 后强制开始）
  var gaps=[], last=0, started=0, done=false, chunkReady=false, worldSince=0;
  /* v25 calibration console hook removed */
  function loop(t){
    requestAnimationFrame(loop);
    var inWorld = !!(window.bot && window.bot.entity && window.world && window.world.scene);
    if(!inWorld){ gaps.length=0; started=0; last=t; done=false; A.settle=0; worldSince=0; return; }
    if(done) return;
    if(!worldSince) worldSince=t;
    if(!chunkReady && t-worldSince<150000){ last=t; return; }
    if(!started){
      if(!A.settle){ A.settle=t; return; }          // ★q18: 进世界后先稳 5s，避开 atlas/chunk 加载高峰
      if(t-A.settle<5000){ last=t; return; }
      started=t; gaps.length=0; last=t; return;
    }
    if(last) gaps.push(t-last);
    last=t;
    if(t-started>=10000 && gaps.length>60){
      done=true;
      var s=gaps.slice().sort(function(a,b){return a-b;});
      var med=s[Math.floor(s.length/2)], p90=s[Math.floor(s.length*0.9)];
      var fps=1000/med, cap=A.cap||1;
      A.calib={fps:+fps.toFixed(1), med:+med.toFixed(1), p90:+p90.toFixed(1), samples:gaps.length};
      if(fps<5){ A.notes.push('校准值 '+fps.toFixed(1)+'fps 过低，疑似加载干扰，保持 '+cap); }
      else if(fps<28 && cap>0.6){ cap=Math.max(0.6, cap-0.25); A.notes.push('校准偏低 '+fps.toFixed(0)+'fps → 上限 '+cap); }
      else if(fps>58 && cap<1){ cap=Math.min(1, cap+0.25); A.notes.push('校准充足 '+fps.toFixed(0)+'fps → 上限 '+cap); }
      else { A.notes.push('校准合适 '+fps.toFixed(0)+'fps → 保持 '+cap); }
      setCap(cap);
      var r=applyToRenderer();
      console.log('[perf-adapt] GPU=' + A.gpu.slice(0,60) + ' | type=' + A.kind + ' | calibrated fps=' + fps.toFixed(1) +
                  ' (中位 ' + med.toFixed(1) + 'ms, p90 ' + p90.toFixed(1) + 'ms) | DPR 上限=' + cap + ' | 应用渲染器=' + r);
    }
  }
  /* v25 calib-off */
  console.log('[perf-adapt] v1 enabled | GPU=' + A.gpu.slice(0,70) + ' | type=' + A.kind);
})();
</script><!-- /perf-auto -->

          if(nw&&nw.name==='beacon'&&nw.position){ var _bk=nw.position.x+','+nw.position.y+','+nw.position.z; addKnown(nw.position.x,nw.position.y,nw.position.z); OFF[_bk]=2; S.force=1; }
          if(o&&o.name==='beacon'&&o.position) delKnown(o.position.x,o.position.y,o.position.z);

  function bgScan(){

  function tick(){
    if(!S.tex) return;

    // ★uib22 跨世界判定：本服同环境世界间传送不发 respawn（dimension 恒 overworld），用行为信号——
    //   单帧位移>500格=跨世界/远tp → KNOWN/光柱全清；维度字段变化同样全清。主城光柱只可能存在于主城。
    var pe2=bot.entity&&bot.entity.position;
    if(pe2){ if(S._lp){ var mx=pe2.x-S._lp.x,my=pe2.y-S._lp.y,mz=pe2.z-S._lp.z; if(mx*mx+my*my+mz*mz>250000){ KNOWN={}; OFF={}; try{window.__srvBeacons={};window.__srvBeaconsNW={};window.__srvBeaconsW={};}catch(e){}; for(var bk in S.beams) dropBeam(bk); log('跨世界判定：大跨度传送 → 信标缓存全清'); } } S._lp={x:pe2.x,y:pe2.y,z:pe2.z}; }

    S._w=bw;
    var cd2=curDim(); if(S._ld&&cd2&&S._ld!==cd2){ KNOWN={}; OFF={}; try{window.__srvBeacons={};window.__srvBeaconsNW={};window.__srvBeaconsW={};}catch(e){}; for(var bk in S.beams) dropBeam(bk); log('维度变化 → 信标缓存全清'); } S._ld=cd2;
    if(window.__qWorld&&S._qw&&window.__qWorld!==S._qw){ KNOWN={}; OFF={}; try{window.__srvBeacons={};window.__srvBeaconsNW={};window.__srvBeaconsW={};}catch(e){}; for(var bk in S.beams) dropBeam(bk); log('世界名变化 → 信标缓存全清'); }

    try{
      var wc3=bot.world;
      if(wc3&&typeof wc3.getColumn==='function'&&pe2&&(!S._fpT||Date.now()-S._fpT>8000)){
        S._fpT=Date.now();
        var ncx=Math.floor(pe2.x/16), ncz=Math.floor(pe2.z/16), proms=[];
        for(var gx3=-1;gx3<=1;gx3++) for(var gz3=-1;gz3<=1;gz3++){ proms.push(wc3.getColumn(ncx+gx3,ncz+gz3)); }

          try{

              if(!c){ fp.push('X'); unl++; continue; }
              var s='';
              try{ if(typeof c.getBlockStateId==='function'){ for(var y3=30;y3<=100;y3+=8){ s+=c.getBlockStateId(8,y3,8)+','; } } }catch(e){}
              if(!s){ try{ if(typeof c.getBlock==='function'){ for(var y4=30;y4<=100;y4+=8){ var b4=c.getBlock(8,y4,8); s+=(b4&&b4.stateId!=null?b4.stateId:'?')+','; } } }catch(e){} }
              if(!s){ fp.push('X'); unl++; continue; }
              fp.push(s);

          if(cur.h!==r.h){

              S.beams[key].h=r.h; S.beams[key].miss=0; S.beams[key].pend=0; S.beams[key].pendN=0;
              log('光柱高度更新 ->', r.h, '(去抖3次确认)');

   在咬合波上叠了 41Hz 高频微颤(wob) + 23Hz 方波方向翻转(dir) —— 两个高频分量
   互相叠乘出混沌抖动，且方波方向翻转是阶跃=顿挫感来源。
   v2：只保留原版 4gt(0.2s) 平滑咬合波（正弦整流，无阶跃无高频），
   外加一个 ~0.25Hz 极慢呼吸摆；咬合幅度略收（原版观感应"慢而稳"）。
   实现：不动 bundle。在 HoldingBlock.armTransformGroup 与 cameraGroup 之间插 wrapper group，
   rAF 每帧对 wrapper 施加"举到嘴边 + 平滑咬合脉冲"；不吃时归零。 */
(function () {
  if (globalThis.__eatAnim && globalThis.__eatAnim.v >= 2) return;
  var A = globalThis.__eatAnim = { v: 2, frames: 0, applied: 0, err: 0, wrapped: 0 };
  function ensureWrap(hb) {
    try {
      if (!hb || !hb.armTransformGroup) return null;
      var atg = hb.armTransformGroup;
      if (atg.__eatWrap) return atg.__eatWrap;
      var P = atg.parent; if (!P) return null;
      var g = new (atg.constructor)();     // 与 atg 同类(THREE.Group)，无参可构造
      g.matrixAutoUpdate = true;
      P.add(g); g.add(atg);                // 夹进层级：cameraGroup -> g -> armTransformGroup
      atg.__eatWrap = g; A.wrapped++;
      return g;
    } catch (e) { A.err++; return null; }
  }
  function zero(g) { g.position.set(0, 0, 0); g.rotation.set(0, 0, 0); }
  function frame() {
    requestAnimationFrame(frame);
    if(!window.__v25Gate('q13',33)) return;
    try {
      var w = globalThis.world; if (!w) return;
      var q = globalThis.__q13; if (!q) return;
      A.frames++;
      var eating = !!(q.active && q.ticks > 0 && q.useItem && q.useHand);
      var food = eating && /apple|bread|porkchop|beef|chicken|mutton|rabbit|cod|salmon|carrot|potato|beetroot|soup|stew|berries|pie|cookie|melon|fish|kelp|flesh|chorus|honey_bottle|milk_bucket|potion|golden_apple|enchanted_golden_apple|rotten_flesh|spider_eye|poisonous_potato|pufferfish|tropical_fish/.test(q.useItem);
      var t = performance.now() / 1000;
      var ph = t * Math.PI * 10;                    // 0.2s 周期 = 原版 4gt 一咬
      var bite = Math.max(0, Math.sin(ph));         // 平滑咬合波 0→1→0（正弦整流，无阶跃）
      var sway = Math.sin(t * 1.6) * 0.012;         // ~0.25Hz 极慢呼吸摆（去抽搐）
      var gMain = w.holdingBlock ? ensureWrap(w.holdingBlock) : null;
      var gOff = w.holdingBlockLeft ? ensureWrap(w.holdingBlockLeft) : null;
      if (gMain) {
        if (food && q.useHand === 'main') {
          gMain.position.set(0.05, 0.20 + 0.05 * bite, 0.14 + 0.04 * bite);

        if (food && q.useHand === 'off') {
          gOff.position.set(-0.05, 0.20 + 0.05 * bite, 0.14 + 0.04 * bite);
          gOff.rotation.set(-0.35 - 0.22 * bite + sway, -0.10 - sway * 0.6, -0.03 * Math.sin(ph + 1.2));
          A.applied++;

  window.__moveDiag.exportHits = function(){ var t = JSON.stringify(__q19Hits.slice(-100), null, 1); console.log(t); return t; };
  function blockAt(p){

<script defer src="/sounds.js?v=s1"></script>

<script>
// 音效桥 v1 —— 把音效包（soundEffectHeard）接到 ThreeJsSound 本地播放
// 依据：493.js 里 ThreeJsSound.playSound(pos, url, volume, pitch, timeout, maxDist)
//   所有 sound_effect 包 → mineflayer emit("soundEffectHeard", soundName, pos, volume, pitch)
//   但 bundle 内零消费者 → 完全没声音。
// 本桥挂在 index.html，等 window.allSoundsMap（sounds.js）+ appViewer 就绪后接线。
(function () {
  var LOG = function () {
    try { console.log.apply(console, ['[SoundBridge]'].concat([].slice.call(arguments))); } catch (e) {}
  };
  window.__soundBridge = { ver: 'v6', ready: false, played: 0, missed: 0, last: '', errors: [] };

  // ---------- 1. 音效名 → 本地 URL ----------
  // allSoundsMap[ver][id+"|"+name] = "id;path;vol,id;path;vol"
  // 但 mineflayer 给的是 soundName 如 "minecraft:entity.generic.eat"
  // 需要建"名字 → 候选路径列表"的索引。
  var nameIndex = null;      // { "minecraft:entity.generic.eat": ["random/eat1","random/eat2","random/eat3"] }
  var nameIndexPlain = null; // 同上，但去掉 minecraft: 前缀

  function buildIndex() {
    var all = window.allSoundsMap;
    if (!all) return false;
    // 挑版本：优先 1.20.4；没有就找最接近的
    var ver = null;
    ['1.20.4', '1.20.5', '1.20.3', '1.21', '1.20.2', '1.20', '1.19.4', '1.19.3', '1.19', '1.18.2', '1.18', '1.17', '1.16.5', '1.16'].some(function (v) {
      if (all[v]) { ver = v; return true; }
      return false;
    });
    if (!ver) {
      // 兜底：取 keys 里最大的
      var ks = Object.keys(all);
      ver = ks[ks.length - 1];
    }
    var tbl = all[ver];
    if (!tbl) return false;
    var idx = {}, idx2 = {};
    for (var k in tbl) {
      // k 形如 "575;entity.generic.eat"
      var name = k;
      var semi = k.indexOf(';');
      if (semi >= 0) name = k.slice(semi + 1);
      // 值形如 "1;random/eat1;1,1;random/eat2;1"
      var v = tbl[k];
      if (!v) continue;
      var paths = [];
      v.split(',').forEach(function (part) {
        var seg = part.split(';');
        // seg: [id, path, vol]
        if (seg.length >= 2 && seg[1]) paths.push(seg[1]);
      });
      if (!paths.length) continue;
      var full = 'minecraft:' + name;
      if (!idx[full]) idx[full] = [];
      idx[full] = idx[full].concat(paths);
      if (!idx2[name]) idx2[name] = [];
      idx2[name] = idx2[name].concat(paths);
    }
    nameIndex = idx;
    nameIndexPlain = idx2;
    window.__soundBridge.version = ver;
    window.__soundBridge.names = Object.keys(idx).length;
    LOG('索引已建立 ver=' + ver + ' 名字数=' + window.__soundBridge.names);
    return true;
  }

  function urlOf(path) {
    // sounds.js 里的 path 形如 "random/eat1"（无扩展名）
    return '/sounds/minecraft/sounds/' + path + '.mp3';
  }

  // ---------- 2. 播放 ----------
  var audioCtxUnlocked = false;

  function playAt(soundName, pos, volume, pitch) {
    var av = window.appViewer;
    if (!av) return false;
    var wr = av.backend && av.backend.soundSystem && av.backend.soundSystem.worldRenderer;
    var ss = wr && wr.soundSystem;
    if (!ss || typeof ss.playSound !== 'function') { window.__soundBridge.missed++; window.__soundBridge.missWhy = 'noSS'; return false; }

    var paths = null;
    if (nameIndex) paths = nameIndex[soundName];
    if (!paths && nameIndexPlain) {
      var plain = soundName.replace(/^minecraft:/, '');
      paths = nameIndexPlain[plain];
      // "entity.generic.eat" 这种带点的，也试下划线形式
      if (!paths) paths = nameIndexPlain[plain.replace(/\./g, '_')];
      if (!paths) paths = nameIndexPlain[soundName.replace(/^minecraft:/, '').replace(/\./g, '_')];
    }
    if (!paths || !paths.length) { window.__soundBridge.missed++; window.__soundBridge.missWhy = 'noPath:' + soundName; return false; }

    var path = paths[Math.floor(Math.random() * paths.length)];
    var url = urlOf(path);

    var p = pos || (wr.cameraWorldPos || { x: 0, y: 0, z: 0 });
    var vol = (typeof volume === 'number' && volume > 0) ? Math.min(volume, 4) : 1;
    var pt = (typeof pitch === 'number' && pitch > 0) ? pitch : 1;
    // mineflayer pitch 是 63 进制（0~63），转成 1 附近
    if (pt > 8) pt = pt / 63 * 2;
    if (pt <= 0) pt = 1;
    var _now = Date.now();

    /* r65 声音节流：同名音效 <=1/120ms，全局 <=24/s —— 削减进入 bundle 声音队列的量，
       消除 "Ignored playing sound ... due to timeout" 队列溢出造成的卡顿 */
    var _sn = (window.__soundBridge._lastByName || (window.__soundBridge._lastByName = {}));
    if (_sn[soundName] && _now - _sn[soundName] < 120) return false;
    var _rs = (window.__soundBridge._recent || (window.__soundBridge._recent = []));
    while (_rs.length && _now - _rs[0] > 1000) _rs.shift();
    if (_rs.length >= 24) return false;
    _sn[soundName] = _now; _rs.push(_now);

      ss.playSound({ x: p.x, y: p.y, z: p.z }, url, vol, pt, 8000, 16);
      window.__soundBridge.played++;
      window.__soundBridge.lastPlayAt = Date.now();
      window.__soundBridge.last = soundName + ' → ' + url;

  function resolveSoundName(idOrName) {
    if (idOrName === null || idOrName === undefined) return null;
    if (typeof idOrName === 'string' && idOrName.indexOf('.') > 0) return idOrName;
    var b = globalThis.bot;
    var reg = b && b.registry && b.registry.sounds;
    // ★uib16: registry(已换 1.20.4 官方表)优先；__SOUND_ID_MAP 为旧版顺序, 只作兜底——
    //          之前 map 优先会把 Paper1.20.4 的 hurt id 错译成羊驼系音效
    if (reg) {
      if (reg[idOrName] && reg[idOrName].name) return reg[idOrName].name;

<script>
/* perf-guard v3：卡顿只治渲染压力，绝不碰区块加载（Alec r19 定版："为什么非要去动一个
   区块加载？你卡顿你就改呀"——r17/r18 两轮视距干预+mesherWasm immutable 后 Alec 的机器

  function cmm(){ var w=wr(); return w&&w.chunkMeshManager||null; }
  function effRd(){ var c=cmm(); if(!c) return 0; return c.performanceOverrideDistance||w_viewDistance(); }
  function w_viewDistance(){ var w=wr(); return (w&&w.viewDistance)||10; }
