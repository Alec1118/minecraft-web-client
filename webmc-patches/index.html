  function swap(a,b,v){return v.split(a).join(b);}
  var touched=false;
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(!k)continue;var v=localStorage.getItem(k);
    var nv=v;
    if(nv.indexOf(OLD)>=0)nv=swap(OLD,NEW,nv);

/* AiAlec perf-auto v5 (2026-10-08) +动态渲染距离降级：DPR 见底后降 renderDistance(防卡死)，FPS 恢复再回弹 */
(function(){
  var Q=new URLSearchParams(location.search);
  var mode=Q.get('perf');
  if(mode==='off'){ window.__perfAuto={mode:'off',ver:'v4'}; return; }

  // ---------- 1. 探测设备 ----------
  var cores=navigator.hardwareConcurrency||4;
  var memGB=navigator.deviceMemory||4;
  var rawDPR=window.devicePixelRatio||1;
  var mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  var gpu='unknown', software=false, discrete=false;
  try{
    var cv=document.createElement('canvas');
    var gl=cv.getContext('webgl2')||cv.getContext('webgl');
    if(gl){
      var dbg=gl.getExtension('WEBGL_debug_renderer_info');
      if(dbg) gpu=String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)||'');
      software=/SwiftShader|Software|llvmpipe|Microsoft Basic/i.test(gpu);
      discrete=/NVIDIA|GeForce|RTX|GTX|Radeon RX|Radeon Pro|Apple M\d|Arc A/i.test(gpu);
      // ★释放探测用的 WebGL context，避免占用显存/context 配额
      try{ var le=gl.getExtension('WEBGL_lose_context'); if(le) le.loseContext(); }catch(e){}
    } else { software=true; }
    cv=null; gl=null;
  }catch(e){}

  // ---------- 2. 分档（放宽，避免把正常机器误判成低档）----------
  var score=0;
  score += cores>=8?3 : cores>=6?2 : cores>=4?1 : 0;
  score += memGB>=16?3 : memGB>=8?2 : memGB>=4?1 : 0;
  if(discrete) score+=4;
  if(software) score-=3;      // 原来 -4 太狠
  if(mobile)   score-=1;
  var tier = mode==='low'?0 : mode==='mid'?1 : mode==='high'?2
           : (score>=6?2 : score>=3?1 : 0);

  // ★v4 关键：不再把 worker 压到 1（区块网格生成会慢到卡），渲染距离也不再压到 3~4
  var DPR_CAP=[1.0, 1.25, 1.5][tier];
  var WORKERS=[2, 2, 6][tier];
  var DIST   =[6, 8, 10][tier];

  // ---------- 3. DPR 钳制（唯一必须早于渲染器执行的补丁）----------
  var _cap=DPR_CAP;
  if(rawDPR>DPR_CAP){
    try{
      Object.defineProperty(window,'devicePixelRatio',{
        configurable:true, enumerable:true,
        get:function(){ return Math.min(rawDPR,_cap); },
        set:function(){}
      });
    }catch(e){}
  }
  window.__perfAutoSetCap=function(v){ _cap=v; };
  window.__perfAutoCap=DPR_CAP;

  // ---------- 4. 设置注入（★只补默认值，绝不覆盖用户已改的项）----------
  var changes=[], S=null, autoDist=false;
  function set(k,v){
    try{
      if(!S) S=window.settings||window.options;
      if(!S||S[k]===v) return false;
      S[k]=v; changes.push(k+'='+v); return true;
    }catch(e){ return false; }
  }
  function apply(){
    S=window.settings||window.options;
    if(!S) return false;
    if(S.rendererWorldPerformance==='normal')
      set('rendererWorldPerformance', tier>=2?'maximum':'normal');   // 低中档保持 normal
    if(!S.rendererMeshersCountOverride && tier>=2)
      set('rendererMeshersCountOverride', WORKERS);                  // 只在高档设 worker 数
    // ★v5: 不再强制 gpuPreference（混合显卡切换会造成标题页/菜单动画顿挫）
    //        并把之前版本强行写入的 high-performance 一次性恢复
    try{
      if(S.gpuPreference==='high-performance' && !localStorage.getItem('__perfGpuReverted')){
        set('gpuPreference','default');
        localStorage.setItem('__perfGpuReverted','1');
        console.log('[perf] gpuPreference force reset restored to default');
      }
    }catch(e){}
    // ★只在「完全没设置过」时才给渲染距离，绝不覆盖用户偏好
    if(S.renderDistance==null){ set('renderDistance', DIST[tier]); autoDist=true; }
    return true;
  }

  // ---------- 5. 看门狗（DPR 见底后降 renderDistance，FPS 恢复再回弹）----------
  var frames=0, t0=performance.now(), boot=performance.now(), distDrops=0, distRaise=0;
  var badStreak=0, goodStreak=0, CAP_FLOOR=0.75, drops=0, avgFps=0;
  function loop(){
    frames++;
    var now=performance.now(), dt=now-t0;
    if(dt>=3000){
      avgFps=frames*1000/dt; frames=0; t0=now;
      if(now-boot<25000){ requestAnimationFrame(loop); return; }   // 25s 宽限期
      // ★v5: 只在真正进入世界后才调 DPR。标题页/菜单里改 DPR 会触发画面重建，
      //      正是"标题页背景动画顿挫"的来源
      if(!(window.bot && window.bot.entity)){ badStreak=0; goodStreak=0; requestAnimationFrame(loop); return; }
      var low = tier>=2?32 : tier>=1?26 : 20;
      var high= tier>=2?55 : tier>=1?48 : 42;
      var DIST_FLOOR=[5,7,8][tier];
      if(avgFps<low){
        goodStreak=0;
        if(++badStreak>=3){
          if(_cap>CAP_FLOOR){ _cap=Math.max(CAP_FLOOR,_cap-0.25); drops++; }   // 先降 DPR
          else if(autoDist){ var d=(S&&S.renderDistance)||0;                     // DPR 见底再降渲染距离（★合理削弱，防卡死）
            if(d>DIST_FLOOR){ try{S.renderDistance=d-1;}catch(e){} distDrops++; } }
          badStreak=0;
        }
      } else if(avgFps>high){
        badStreak=0;
        if(_cap<DPR_CAP && ++goodStreak>=4){ _cap=Math.min(DPR_CAP,_cap+0.25); goodStreak=0; }
        else if(autoDist && ++goodStreak>=6){ var d=(S&&S.renderDistance)||0;   // DPR 已满再回弹渲染距离
          if(d<DIST[tier]){ try{S.renderDistance=d+1;}catch(e){} distRaise++; } goodStreak=0; }
      } else { badStreak=0; goodStreak=0; }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- 6. 轮询装设置 ----------
  var tries=0;
  var iv=setInterval(function(){ if(apply()||++tries>200) clearInterval(iv); },50);

  // ---------- 7. 诊断 ----------
  window.__perfAuto={
    ver:'v5', tier:tier, cores:cores, memGB:memGB, gpu:gpu,
    discrete:discrete, software:software, mobile:mobile,
    dprRaw:rawDPR, dprCap:DPR_CAP, workers:WORKERS,
    dist:DIST[tier], changes:changes, distDrops:distDrops, distRaise:distRaise,
    get drops(){return drops;}, get avgFps(){return avgFps;},
    get appliedCap(){return _cap;}, get distNow(){return S&&S.renderDistance;},
    log:function(){ try{console.log('[perf]',this);}catch(e){} return this; }
  };
  if(mode==='debug') setTimeout(function(){ try{console.log('[perf] v4 ready',window.__perfAuto);}catch(e){} },1500);
})();
</script>
<!-- perf-adapt --><script>
/* AiAlec 设备自适应 v1 (2026-09-15)
   在 perf-auto 之上做「按这台机器算」：
   1) 读真实 GPU 型号（WEBGL_debug_renderer_info）→ 分类 software / integrated / discrete
   2) 进世界前先按 GPU 归类给一个初始 DPR 上限
   3) 进世界后做一次 10 秒帧率校准，按帧率中位数再微调，并把上限真正应用到渲染器
   诊断：__perfAdapt */
(function(){
  var A = window.__perfAdapt = {ver:'v1', gpu:'?', kind:'?', base:null, cap:null, calib:null, applied:0, renderer:'?', notes:[]};

  function probeGL(){
    var out={gpu:'?',kind:'unknown',ver:'?'};
    try{
      var c=document.createElement('canvas');
      var gl=c.getContext('webgl2')||c.getContext('webgl');
      if(!gl){ out.kind='none'; return out; }
      var ext=gl.getExtension('WEBGL_debug_renderer_info');
      out.gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '(no debug ext)';
      out.ver = String(gl.getParameter(gl.VERSION)||'').slice(0,40);
      out.kind = /swiftshader|llvmpipe|softwarerasterizer|software|basic render|mesa offscreen|virtualbox|vmware/i.test(out.gpu) ? 'software'
               : /nvidia|geforce|rtx|gtx|quadro|radeon rx|radeon pro|arc a\d|apple m\d/i.test(out.gpu) ? 'discrete'
               : /intel|uhd|iris|hd graphics|vega|radeon graphics|mali|adreno|powervr|apple gpu/i.test(out.gpu) ? 'integrated'
               : 'unknown';
      try{ var l=gl.getExtension('WEBGL_lose_context'); if(l) l.loseContext(); }catch(e){}
    }catch(e){ out.gpu='err:'+e.message; }
    return out;
  }
  A.probe = probeGL(); A.gpu = A.probe.gpu; A.kind = A.probe.kind;

  var KIND_CAP = { software:0.75, none:0.75, integrated:1.0, unknown:1.0, discrete:1.5 };
  function setCap(v){
    try{ A.cap=v; if(window.__perfAutoSetCap) window.__perfAutoSetCap(v); A.applied++; }catch(e){}
  }
  function applyToRenderer(){
    var v=window.devicePixelRatio, used='none', cands=[];
    try{ if(window.renderer) cands.push(window.renderer); }catch(e){}
    try{ if(window.appViewer&&window.appViewer.worldView) cands.push(window.appViewer.worldView); }catch(e){}
    for(var i=0;i<cands.length;i++){
      var r=cands[i];
      if(r&&typeof r.setPixelRatio==='function'){
        try{ r.setPixelRatio(v); used=(r.type||'renderer'); break; }catch(e){}
      }
    }
    A.renderer=used; return used;
  }

  // ① 进世界前先定初始上限（渲染器创建时会读 window.devicePixelRatio）
  var iv=setInterval(function(){
    if(window.__perfAuto && A.base===null){ A.base = window.__perfAuto.dprCap; }
    if(window.__perfAutoSetCap){
      setCap(KIND_CAP[A.kind]);
      A.notes.push('初始上限 ' + KIND_CAP[A.kind] + '（GPU 类型 ' + A.kind + '）');
      clearInterval(iv);
    }
  }, 120);

  // ② 进世界后 10 秒校准
  var gaps=[], last=0, started=0, done=false;
  function loop(t){
    requestAnimationFrame(loop);
    var inWorld = !!(window.bot && window.bot.entity && window.world && window.world.scene);
    if(!inWorld){ gaps.length=0; started=0; last=t; done=false; A.settle=0; return; }
    if(done) return;
    if(!started){
      if(!A.settle){ A.settle=t; return; }          // ★q18: 进世界后先稳 5s，避开 atlas/chunk 加载高峰
      if(t-A.settle<5000){ last=t; return; }
      started=t; gaps.length=0; last=t; return;
    }
    if(last) gaps.push(t-last);
    last=t;
    if(t-started>=10000 && gaps.length>60){
      done=true;
      var s=gaps.slice().sort(function(a,b){return a-b;});
      var med=s[Math.floor(s.length/2)], p90=s[Math.floor(s.length*0.9)];
      var fps=1000/med, cap=A.cap||1;
      A.calib={fps:+fps.toFixed(1), med:+med.toFixed(1), p90:+p90.toFixed(1), samples:gaps.length};
      if(fps<5){ A.notes.push('校准值 '+fps.toFixed(1)+'fps 过低，疑似加载干扰，保持 '+cap); }
      else if(fps<28 && cap>0.6){ cap=Math.max(0.6, cap-0.25); A.notes.push('校准偏低 '+fps.toFixed(0)+'fps → 上限 '+cap); }
      else if(fps>58 && cap<1.5){ cap=Math.min(1.5, cap+0.25); A.notes.push('校准充足 '+fps.toFixed(0)+'fps → 上限 '+cap); }
      else { A.notes.push('校准合适 '+fps.toFixed(0)+'fps → 保持 '+cap); }
      setCap(cap);
      var r=applyToRenderer();
      console.log('[perf-adapt] GPU=' + A.gpu.slice(0,60) + ' | type=' + A.kind + ' | calibrated fps=' + fps.toFixed(1) +
                  ' (中位 ' + med.toFixed(1) + 'ms, p90 ' + p90.toFixed(1) + 'ms) | DPR 上限=' + cap + ' | 应用渲染器=' + r);
    }
  }
  requestAnimationFrame(loop);
  console.log('[perf-adapt] v1 enabled | GPU=' + A.gpu.slice(0,70) + ' | type=' + A.kind);
})();
</script><!-- /perf-auto -->

<!-- lightfix-v24: update_light -> worldView.loadChunk(pos,true) 重发整列（含新光照）→ mesher 换新列数据重网格。
     真因链：update_light 只写 bot.world（mineflayer blocks 插件注入）；渲染器/mesher 的列副本只在 addColumn（postMessage chunk）时刷新；
     上游 loadChunk(isLightUpdate) 机制（重发整列+setSectionDirty+跳过邻居列）无人调用（listenToBot 桥断裂，与 blockUpdate 断桥同根因）。
     v22 的 world.lightUpdate=setSectionDirty 只发 {type:dirty} 给 mesher → 用旧列副本重网格 → 光照不更新（Alec: "光照延时还是有的"）。
     v24（Alec 10-22 实测反馈）：服务端光照 BFS 分 tick 批次推 update_light，v23 250ms 合批窗只圈得住前几批 → 视觉呈"正方形扩散"波浪式一块块亮；
     且挖/放频繁时 mesher 持续整列重网格致画面卡。改为：400ms 合批 + 静默顺延（120ms 无新包才发，等 BFS 收齐，上限 1.5s）
     + 同列 1s 最小重发间隔（连续挖放时限流保 mesher）。仅对已加载列生效；loadChunk 不可用/零命中回退 lightUpdate。 -->
<script>(function(){ var n=0,t=setInterval(function(){ var b=globalThis.bot; if(!b||!b._client||!b._client.on) return; if(b.__alecLit){ clearInterval(t); return; } if(++n>600){ clearInterval(t); return; } b.__alecLit=1; clearInterval(t);
  try{
    var pend={}, tm=0, lastArr=0, startT=0, lastSent={};
    var LIT={bat:0,col:0,def:0,hold:0}; window.__fastLit=LIT;
    function wv(){ try{ var w=globalThis.world; if(w&&w.displayOptions&&w.displayOptions.worldView&&typeof w.displayOptions.worldView.loadChunk==='function') return w.displayOptions.worldView; }catch(e){}
      try{ var a=window.appViewer; if(a&&a.worldView&&typeof a.worldView.loadChunk==='function') return a.worldView; }catch(e){} return null; }
    function flush(){
      tm=0;
      var now=Date.now();
      if(now-lastArr<120 && now-startT<1500){ LIT.def++; tm=setTimeout(flush,120); return; }
      var list=[]; for(var k in pend){ list.push(pend[k]); } pend={};
      var v=wv(), w=globalThis.world, ok=0;
      for(var i=0;i<list.length;i++){
        var lx=list[i][0], lz=list[i][1], kk=lx+','+lz;
        if(!v||!v.loadedChunks||!v.loadedChunks[kk]) continue;
        if(lastSent[kk]&&now-lastSent[kk]<1000){ pend[kk]=[lx,lz]; LIT.hold++; continue; }
        try{ var pr=v.loadChunk({x:lx,z:lz}, true, 'lightfix'); if(pr&&pr.catch) pr.catch(function(){}); lastSent[kk]=now; ok++; LIT.col++; }catch(e){}
      }
      LIT.bat++;
      if(!ok&&w&&typeof w.lightUpdate==='function'){
        for(var j=0;j<list.length;j++){ try{ w.lightUpdate(list[j][0]*16, list[j][1]*16); }catch(e){} }
      }
      startT=0;
      for(var k2 in pend){ if(!tm){ tm=setTimeout(flush,1000); break; } }
    }
    b._client.on('update_light', function(p){
      try{
        if(!p) return;
        var cx=p.chunkX, cz=p.chunkZ;
        if(typeof cx!=='number'||typeof cz!=='number') return;
        lastArr=Date.now();
        if(!startT) startT=lastArr;
        pend[cx+','+cz]=[cx,cz];
        if(!tm) tm=setTimeout(flush,400);
      }catch(e){}
    });
    console.log('[lightfix] v24 update_light -> worldView.loadChunk(isLightUpdate) 已接线');
  }catch(e){}
}, 500); })(); </script>

  function loadTex(){

  // 每 50ms（1 tick）更新旋转 + 纹理流动；不用 rAF，避免和渲染循环抢帧
  function startAnim(){

  function makeBeam(x,y,z,h){
    var T=S.THREE;
    var outer=new T.Group();                    // ★ 只 track 外层（位置固定）
    try{ if(window.world&&window.world.sceneOrigin&&window.world.sceneOrigin.track) window.world.sceneOrigin.track(outer); }catch(e){ log('track 失败:',e&&e.message); }
    outer.position.set(x+0.5,y+1,z+0.5);
    var spin=new T.Group();                     // ★ 旋转放在内层，不影响 outer
    outer.add(spin);
    function layer(r,op){
      var g=new T.BoxGeometry(r*2,h,r*2);       // 方柱，每面各用完整纹理（同原版 uu1=0,uu2=1）
      var m=new T.MeshBasicMaterial({map:S.tex,transparent:true,opacity:op,
                                     depthWrite:false,side:T.DoubleSide,fog:false,
                                     toneMapped:false});
      var mesh=new T.Mesh(g,m);
      mesh.position.y=h/2;mesh.frustumCulled=false;
      return mesh;
    }
    spin.add(layer(R_IN,OP_IN));
    spin.add(layer(R_OUT,OP_OUT));
    try{S.scene.add(outer);}catch(e){log('add 失败:',e&&e.message);}
    log('光柱已建 @',x,y,z,'| 高度',h,'| 半径 内',R_IN,'外',R_OUT,'| opacity',OP_IN+'/'+OP_OUT);
    return {outer:outer,spin:spin};
  }
  function disposeObj(o){
    if(!o) return;
    try{ if(o.geometry&&o.geometry.dispose) o.geometry.dispose(); }catch(e){}
    try{
      if(o.material){
        var ms=Array.isArray(o.material)?o.material:[o.material];
        for(var i=0;i<ms.length;i++){
          try{ if(ms[i].map&&ms[i].map!==S.tex&&ms[i].map.dispose) ms[i].map.dispose(); }catch(e){}
          try{ ms[i].dispose(); }catch(e){}
        }
      }
    }catch(e){}
    try{ if(o.children) for(var j=0;j<o.children.length;j++) disposeObj(o.children[j]); }catch(e){}
  }
  function dropBeam(k){
    var bm=S.beams[k];
    try{ if(bm&&bm.outer) S.scene.remove(bm.outer); }catch(e){}
    try{ disposeObj(bm&&bm.outer); }catch(e){}      // ★释放 geometry/material，防 GPU 资源泄漏
    delete S.beams[k];
  }

  function inspect(bot,x,y,z){
    // ★v21d：用普通 {x,y,z} 代替 bot.entity.position.constructor，去掉对 bot.entity 的硬依赖（慢机器/未进服时不会再卡死）
    function at(xx,yy,zz){ try{ return bot.blockAt({x:xx,y:yy,z:zz}); }catch(e){ return null; } }
    var self=at(x,y,z);
    /* v21e: blockAt 偶发 null(列未就绪)不再判死 lit:null——信标存在性已由 findBlocks/blockUpdate 确认，
       底座/光路各自独立乐观放行，等数据到位自然校正 */
    /* Levels 检查移除：客户端信标方块实体数据不可靠，改由底座+光路判定 */
    /* ★uib25 底座判定改服务器权威：TNTGuard.beaconScan 按原版规则算层数，下发 §8[BEAM]x,y,z,world,levels。
       客户端 blockAt 在本服读不到底座数据(9/9 null)是历史顽疾，乐观放行又导致"放上去就亮"——全部废弃。
       信号未到 → lit:null 挂起（信号 2 秒内必到）；层数 0 → 熄灭 */
    var __lv=null;
    try{ var __sb=window.__srvBeacons; if(__sb){ var __bk=x+','+y+','+z+','+curDim(); if(Object.prototype.hasOwnProperty.call(__sb,__bk)) __lv=__sb[__bk]; } }catch(e){}
    // ★v22 无世界 key 回退：curDim() 与服务端世界名不一致时（多世界/AlecCity 等）仍能拿到层数
    try{ if(__lv===null||__lv===undefined){ var __nw=window.__srvBeaconsNW; if(__nw){ var __nk=x+','+y+','+z; if(Object.prototype.hasOwnProperty.call(__nw,__nk)) __lv=__nw[__nk]; } } }catch(e){}
    try{
      if(__lv===null||__lv===undefined){
        var _mb=globalThis.__mainBE;
        if(_mb){ var _co=_mb[(x>>4)+','+(z>>4)];
          if(_co){ var _be=_co[x+','+y+','+z];
            if(_be&&_be.Levels!==undefined&&_be.Levels!==null){
              var _Lv=_be.Levels; __lv=(typeof _Lv==='object'&&_Lv.value!==undefined)?_Lv.value:_Lv;
            } } }
      }
    }catch(e){}
    /* ★v22 第三数据源：主线程列 blockEntities——mineflayer map_chunk 时 setBlockEntity 已填充，
       key=区块局部坐标 (x&15),y,(z&15)；form A 值=nbtData({value:{...}})，form B 值={value:{...,nbtData}}，双形态兼容 */
    try{
      if(__lv===null||__lv===undefined){
        var _b2=globalThis.bot||window.bot; var _w2=_b2&&_b2.world;
        var _col=_w2&&_w2.getColumn?_w2.getColumn(x>>4,z>>4):null;
        if(_col&&_col.blockEntities){
          var _k2=(15&x)+','+y+','+(15&z);
          var _be2=_col.blockEntities[_k2];
          if(_be2){
            var _n2=(_be2.value&&_be2.value.nbtData)?_be2.value.nbtData:_be2;
            var _Lv2=_n2&&_n2.value?_n2.value.Levels:(_n2&&_n2.Levels);
            if(_Lv2!=null&&_Lv2!==undefined){ __lv=(typeof _Lv2==='object'&&_Lv2.value!==undefined)?_Lv2.value:_Lv2; }
          }
        }
      }
    }catch(e){}
    if(__lv===null) return {lit:null, why:'等服务器信标判定'};
    if(__lv<=0) return {lit:false, why:'底座无矿物层(服务器判定)'};
    // ★正上方 Y 列：遇到「确定非透光」方块 → 熄灭（原版语义：不生成光柱）；数据未到 → 乐观跳过
    var dbg=[], blocked=false, firstSolid=0, blockName='';
    for(var ty=y+1;ty<=y+MAX_H;ty++){
      var bb=at(x,ty,z);
      if(!bb){ if(dbg.length<6) dbg.push(ty+':NULL'); continue; }
      if(dbg.length<6) dbg.push(ty+':'+(bb.name||'?'));
      if(!isClear(bb)){ blocked=true; firstSolid=ty; blockName=String(bb.name||'?'); break; }
    }
    if(S.tick%10===0) log('信标@'+x+','+y+','+z+' 采样:', dbg.join(' | '), blocked?('→ 被挡: '+blockName+' @y='+firstSolid+' → 熄灭'):('→ 无阻挡(服务器层数='+__lv+')'));
    if(blocked) return {lit:false, why:blockName+'@'+firstSolid};
    return {lit:true,h:MAX_H};
  }

  // ---------- v15 性能修复：信标集合增量维护，替代每 2 秒全图 findBlocks ----------
  var KNOWN={}, LASTSCAN=Date.now()+10000, SCAN_MS=45000, SCAN_R=32, IDLE_MS=300, FIRST_SCAN=1;
  var OFF={};
  // ★只读诊断：控制台敲 __beam.dump() 看光柱/已知信标/扫描半径
  window.__beam = S;
  S.dump = function(){ return {beams:Object.keys(S.beams), known:Object.keys(KNOWN), off:Object.keys(OFF), scanR:SCAN_R, tick:S.tick, tex:!!S.tex}; };
  S.light=function(x,y,z,h){var k=x+','+y+','+z;addKnown(x,y,z);OFF[k]=9;if(S.beams[k])dropBeam(k);S.beams[k]=makeBeam(x,y,z,h||320);S.beams[k].h=h||320;S.beams[k].forced=1;log('手动点亮',k);};
  S.unlight=function(x,y,z){var k=x+','+y+','+z;if(S.beams[k])dropBeam(k);log('手动熄灭',k);};
  S.why=function(x,y,z){var b=window.bot;if(!b)return 'no-bot';return inspect(b,x,y,z);};   // 光柱当前熄灭的连续确认计数
  function curDim(){ try{ if(window.__qWorld) return window.__qWorld;   // ★uib23: 服务器切世界时下发的权威世界名优先
    var b=window.bot||globalThis.bot; if(!b) return ''; var g=b.game||{}; return String(g.dimension||b.dimension||'').replace(/^minecraft:/,''); }catch(e){ return ''; } }
  function addKnown(x,y,z){ try{ var pe=globalThis.bot&&globalThis.bot.entity&&globalThis.bot.entity.position; if(pe){ var ax=x-pe.x,ay=y-pe.y,az=z-pe.z; if(ax*ax+ay*ay+az*az>16384) return; } }catch(e){}   // ★uib21: 登记源头限 128 格——远处信标根本不进 KNOWN，杜绝跨世界光柱
    var k=x+','+y+','+z; if(!KNOWN[k]) KNOWN[k]={x:x,y:y,z:z,dim:curDim()}; }
  function delKnown(x,y,z){ var k=x+','+y+','+z; if(KNOWN[k]) delete KNOWN[k]; }
  function hookUpdates(){
    if(S.hooked) return;
    var b=window.bot; if(!b||!b.on) return;
    S.hooked=1;
    try{
      b.on('blockUpdate', function(o,nw){
        try{
          if(nw&&nw.name==='beacon'&&nw.position) addKnown(nw.position.x,nw.position.y,nw.position.z);
          if(o&&o.name==='beacon'&&o.position) delKnown(o.position.x,o.position.y,o.position.z);
          // ★v21 任意方块变动落在已知信标上方 → 立刻重查（原版反应只有几个 tick）
          var p=(nw&&nw.position)||(o&&o.position);
          if(p){ for(var kk in KNOWN){ var q=KNOWN[kk];
            if(q.x===p.x&&q.z===p.z&&p.y>q.y){
              S.force=1;
              // ★v21b：该格变成透明/空气 → 视为一次「可重建」确认
              //（客户端区块重发会让读到的方块反复回退，光靠轮询要等近 10 秒）
              if(nw&&nw.name&&isClear(nw)) OFF[kk]=2;
              break; } } }
        }catch(e){}
      });
      try{ b.on('spawn', function(){ try{ for(var k in S.beams){ dropBeam(k); } KNOWN={}; OFF={}; log('维度切换/重生 → 信标缓存已清空'); }catch(e){} }); }catch(e){}
      log('已挂 blockUpdate 增量监听');
    }catch(e){ log('hook 失败:',e&&e.message); }
  }
  function bgScan(){
    var b=window.bot; if(!b||!b.entity) return;
    var t0=performance.now();
    try{
      var list=b.findBlocks({matching:function(x){return x&&x.name==='beacon';},maxDistance:SCAN_R,count:64});
      for(var i=0;i<list.length;i++){ var p=list[i]; addKnown(p.x,p.y,p.z); }
      var ms=performance.now()-t0;
      // 自适应：扫描超过 120ms 就把半径砍半，避免下次再卡
      if(ms>150&&SCAN_R>24){ SCAN_R=Math.max(24,SCAN_R>>1); log('扫描耗时',ms.toFixed(0)+'ms，半径自适应降为',SCAN_R); }
    }catch(e){ log('扫描失败:',e&&e.message); }
  }
  function tick(){
    if(!S.tex) return;
    var bot=window.bot||globalThis.bot; if(!bot) return;
    // ★uib22 跨世界判定：本服同环境世界间传送不发 respawn（dimension 恒 overworld），用行为信号——
    //   单帧位移>500格=跨世界/远tp → KNOWN/光柱全清；维度字段变化同样全清。主城光柱只可能存在于主城。
    var pe2=bot.entity&&bot.entity.position;
    if(pe2){ if(S._lp){ var mx=pe2.x-S._lp.x,my=pe2.y-S._lp.y,mz=pe2.z-S._lp.z; if(mx*mx+my*my+mz*mz>250000){ KNOWN={}; OFF={}; for(var bk in S.beams) dropBeam(bk); log('跨世界判定：大跨度传送 → 信标缓存全清'); } } S._lp={x:pe2.x,y:pe2.y,z:pe2.z}; }
    var cd2=curDim(); if(S._ld&&cd2&&S._ld!==cd2){ KNOWN={}; OFF={}; for(var bk in S.beams) dropBeam(bk); log('维度变化 → 信标缓存全清'); } S._ld=cd2;
    var now=Date.now(); if(!S.force && now-S.last<IDLE_MS) return; S.last=now; S.force=0;
    if(now-LASTSCAN>SCAN_MS){ LASTSCAN=now; hookUpdates(); bgScan(); }
    var seen={}, n=0, cd=curDim();
    for(var key in KNOWN){
      var pp=KNOWN[key]; seen[key]=1;
      if(pp.dim&&cd&&pp.dim!==cd){ pp.lastWhy='他维度:'+cd; try{ if(S.beams&&S.beams[key]) dropBeam(key); }catch(e){} continue; }
      // ★v24: 本服所有 NORMAL 世界客户端都报 overworld → dim 判定天然失效，改距离判定：>600 格不点亮+拆光柱
      var __pe=bot.entity&&bot.entity.position;
      if(__pe){ var __dx=pp.x-__pe.x,__dy=pp.y-__pe.y,__dz=pp.z-__pe.z,__d2=__dx*__dx+__dy*__dy+__dz*__dz;
        if(__d2>360000){ pp.lastWhy='太远:'+Math.round(Math.sqrt(__d2)); try{ if(S.beams&&S.beams[key]) dropBeam(key); }catch(e){} continue; } }
      var r=inspect(bot,pp.x,pp.y,pp.z);
      pp.lastWhy=(r.lit===true)?'lit':(r.why||'挂起');
      if(r.lit===null){ if(S.beams[key]) n++; continue; }
      if(r.lit){
        var cur=S.beams[key];
        if(!cur){
          OFF[key]=(OFF[key]||0)+1;
          if(OFF[key]<2){ continue; }   // ★需连续 2 次确认无阻挡才重建，抗方块数据抖动
          delete OFF[key];
          S.beams[key]=makeBeam(pp.x,pp.y,pp.z,r.h); S.beams[key].h=r.h; S.beams[key].miss=0; S.beams[key].pend=0; S.beams[key].pendN=0;
          log('光柱重建 @',key,'高度',r.h); n++; continue;
        }
        else{
          cur.miss=0;
          if(cur.h!==r.h){
            // ★去抖：连续 3 次读到同一个新高度才重建，避免 y 轴方块数据反复导致光柱闪烁
            if(cur.pend===r.h){ cur.pendN=(cur.pendN||0)+1; } else { cur.pend=r.h; cur.pendN=1; }
            if(cur.pendN>=3&&!cur.forced){
              dropBeam(key); S.beams[key]=makeBeam(pp.x,pp.y,pp.z,r.h);
              S.beams[key].h=r.h; S.beams[key].miss=0; S.beams[key].pend=0; S.beams[key].pendN=0;
              log('光柱高度更新 ->', r.h, '(去抖3次确认)');
            }
          } else { cur.pend=0; cur.pendN=0; }
        }
        n++;
      } else {
        // ★v21：一读到阻挡立刻熄灭（原版延迟仅 距离/10 tick，不能等 12 秒）；
        // 并且不删 KNOWN —— 拆掉方块后还要能恢复
        delete OFF[key];
        if(S.beams[key]&&!S.beams[key].forced){ dropBeam(key); log('光柱熄灭 @',key,'←',(r.why||'被方块阻挡')); }
      }
    }
    for(var k2 in S.beams){ if(!seen[k2]&&++S.beams[k2].miss>=5) dropBeam(k2); }
    if(++S.tick%10===0){
      var det=[]; for(var kk in KNOWN){ var q=KNOWN[kk]; det.push(kk+'['+(q.dim||'?')+' '+(q.lastWhy||'-')+']'); }
      log('已点亮信标:',n,'| 光柱:',Object.keys(S.beams).length,
          '| 已知信标:',Object.keys(KNOWN).length, det.join(' '),
          '| scene children:',S.scene.children.length,
          '| 区块:',(window.world&&window.world.sectionObjects?Object.keys(window.world.sectionObjects).length:'?'));
    }
  }

  var iv=setInterval(function(){
    if(S.scene&&window.world&&window.world.scene===S.scene){tick();return;}
    if(S.scene&&window.world&&window.world.scene!==S.scene){S.scene=null;S.beams={};S.tex=null;S.tried=0;KNOWN={};S.hooked=0;LASTSCAN=0;}
    var r=init();
    if(r==='ok'){loadTex();tick();return;}
    if(++S.tried%5===0)log('等待:',r,'(第'+S.tried+'次)');
    if(S.tried%200===0)log('仍在等待:',r,'(第'+S.tried+'次)');
  },1500);
})();

    if(!b||!b.entity||!b.entity.position) return;

    var ld=null;
    try{ if(b.entity.yaw!=null){
      var yaw=b.entity.yaw, pitch=(b.entity.pitch||0);
      ld={x:-Math.sin(yaw)*Math.cos(pitch), y:-Math.sin(pitch), z:-Math.cos(yaw)*Math.cos(pitch)};
    }}catch(e){}
    if(!ld) ld={x:0,y:1,z:0};
    pendingDir=ld;

    F.hasExpl = nbt.known ? nbt.has : null;
    F.colors = nbt.colors && nbt.colors.length ? nbt.colors : null;
    pendingExpl = nbt.known ? nbt.has : null;
    pendingColors = nbt.colors && nbt.colors.length ? nbt.colors : null;
    pendingFlight = nbt.flight || 1;
  };

  function spawnLocal(){
    if(!tex||!pendingPos||!pendingDir) return;
    var g=makeMesh();
    g.position.set(pendingPos.x,pendingPos.y,pendingPos.z);
    try{ scene.add(g); }catch(e){ return; }
    // 存活按物品 Flight 估算（原版 1→约1.5s，3→约2.5s）
    var life = 1.2 + 0.45*(Number(pendingFlight)||1);
    locals.push({g:g, dir:pendingDir, spd:1.15, born:Date.now(), life:life*1000});
    F.localMade++; F.spawned++;

                (pendingExpl===null?'未知(默认炸)':pendingExpl));
  }

  /* ---------- 主循环 ---------- */
  function sync(){
    var b=window.bot;
    if(!b||!b.entities||!refs()) return;
    if(!tex) makeTex();
    if(!dotTex) makeDot();
    if(!tex) return;

    /* 真实体（联机） */
    for(var id in b.entities){
      var e=b.entities[id];
      if(!e) continue;
      var nm=String((e.name||e.entityType||'')+' '+(e.displayName||''));
      if(nm.trim()&&F.seen.indexOf(nm)<0&&F.seen.length<25) F.seen.push(nm);
      if(!isFw(e)) continue;
      if(!tracked[id]){
        var g=makeMesh();
        if(e.position) g.position.set(e.position.x,e.position.y,e.position.z);
        try{ scene.add(g); }catch(err){}
        tracked[id]=g; F.spawned++;

      var now=Date.now();

      if(e.position) tracked[id].userData = {x:e.position.x,y:e.position.y,z:e.position.z};
    }

        kill(g2); delete tracked[id2]; delete lastTrail[id2]; F.removed++;
        continue;
      }
      act++;
      if(e2.position) g2.position.set(e2.position.x,e2.position.y,e2.position.z);
    }

    /* 本地视觉火箭 */
    if(pendingAt && Date.now()-pendingAt>400){
      if(!anyRealFirework()) spawnLocal();
      pendingAt=0;
    }
    if(locals.length && anyRealFirework()){
      for(var i=0;i<locals.length;i++){ kill(locals[i].g); F.removed++; }
      locals.length=0;
      console.log('[fwrender] real firework entity arrived, local fake handed over');
    }
    for(var j=locals.length-1;j>=0;j--){
      var L=locals[j], age=Date.now()-L.born;
      if(age>L.life){
        // ★飞行结束 → 按原版规则：有烟花之星才炸
        var pp=L.g.position, life0=(pendingExpl!==false);
        if(F.burstOn && life0) spawnBurst(pp.x,pp.y,pp.z, pendingColors);
        else console.log('[fwrender] rocket done: no firework star (vanilla: no explosion, trail only)');
        kill(L.g); F.removed++; locals.splice(j,1); continue;
      }
      L.spd*=0.985;
      L.g.position.x+=L.dir.x*L.spd; L.g.position.y+=L.dir.y*L.spd; L.g.position.z+=L.dir.z*L.spd;
      if(!L.t || Date.now()-L.t>70){ L.t=Date.now(); spawnTrail(L.g.position.x,L.g.position.y,L.g.position.z); }
      act++;
    }

    /* 粒子推进 */
    var nowp=Date.now();
    for(var q=parts.length-1;q>=0;q--){
      var P=parts[q], d=(nowp-P.born)/P.life;
      if(d>=1){ kill(P.g); parts.splice(q,1); continue; }
      P.vy-=0.006;                       // 轻微重力
      P.vx*=0.97; P.vy*=0.97; P.vz*=0.97;
      P.g.position.x+=P.vx; P.g.position.y+=P.vy; P.g.position.z+=P.vz;
      try{ P.g.material.opacity=Math.max(0,1-d); P.g.scale.setScalar(1-d*0.45); }catch(e){}
      act++;
    }
    F.parts=parts.length;
    F.active=act;
  }
  setInterval(sync, 120);

  F.setSize=function(v){ F.size=Number(v)||0.85; for(var k in tracked){ var g=tracked[k];
    for(var i=0;i<g.children.length;i++){ try{ g.children[i].geometry.dispose(); }catch(e){}
      g.children[i].geometry=new T.PlaneGeometry(F.size,F.size); } } return F.size; };
  F.setBurst=function(v){ F.burstOn = (v!==false); console.log('[fwrender] explosion toggle = '+F.burstOn); return F.burstOn; };
  console.log('[fwrender] v7 enabled (vanilla tex + trail + explosion; starless rockets do not explode)');
})();

// 依据：493.js 里 ThreeJsSound.playSound(pos, url, volume, pitch, timeout, maxDist)
//   所有 sound_effect 包 → mineflayer emit("soundEffectHeard", soundName, pos, volume, pitch)
//   但 bundle 内零消费者 → 完全没声音。

(function () {
  var LOG = function () {

  // allSoundsMap[ver][id+"|"+name] = "id;path;vol,id;path;vol"

  // 需要建"名字 → 候选路径列表"的索引。
  var nameIndex = null;      // { "minecraft:entity.generic.eat": ["random/eat1","random/eat2","random/eat3"] }
  var nameIndexPlain = null; // 同上，但去掉 minecraft: 前缀

  function buildIndex() {
    var all = window.allSoundsMap;
    if (!all) return false;
    // 挑版本：优先 1.20.4；没有就找最接近的
    var ver = null;
    ['1.20.4', '1.20.5', '1.20.3', '1.21', '1.20.2', '1.20', '1.19.4', '1.19.3', '1.19', '1.18.2', '1.18', '1.17', '1.16.5', '1.16'].some(function (v) {
      if (all[v]) { ver = v; return true; }

    });
    if (!ver) {
      // 兜底：取 keys 里最大的
      var ks = Object.keys(all);
      ver = ks[ks.length - 1];
    }
    var tbl = all[ver];
    if (!tbl) return false;
    var idx = {}, idx2 = {};
    for (var k in tbl) {
      // k 形如 "575;entity.generic.eat"
      var name = k;
      var semi = k.indexOf(';');
      if (semi >= 0) name = k.slice(semi + 1);
      // 值形如 "1;random/eat1;1,1;random/eat2;1"
      var v = tbl[k];
      if (!v) continue;
      var paths = [];
      v.split(',').forEach(function (part) {
        var seg = part.split(';');
        // seg: [id, path, vol]
        if (seg.length >= 2 && seg[1]) paths.push(seg[1]);
      });
      if (!paths.length) continue;
      var full = 'minecraft:' + name;
      if (!idx[full]) idx[full] = [];
      idx[full] = idx[full].concat(paths);
      if (!idx2[name]) idx2[name] = [];
      idx2[name] = idx2[name].concat(paths);
    }
    nameIndex = idx;
    nameIndexPlain = idx2;
    window.__soundBridge.version = ver;
    window.__soundBridge.names = Object.keys(idx).length;
    LOG('索引已建立 ver=' + ver + ' 名字数=' + window.__soundBridge.names);
    return true;
  }

  function urlOf(path) {
    // sounds.js 里的 path 形如 "random/eat1"（无扩展名）

  var audioCtxUnlocked = false;

  function playAt(soundName, pos, volume, pitch) {
    var av = window.appViewer;
    if (!av) return false;
    var wr = av.backend && av.backend.soundSystem && av.backend.soundSystem.worldRenderer;
    var ss = wr && wr.soundSystem;
    if (!ss || typeof ss.playSound !== 'function') { window.__soundBridge.missed++; window.__soundBridge.missWhy = 'noSS'; return false; }

    var paths = null;
    if (nameIndex) paths = nameIndex[soundName];

      paths = nameIndexPlain[plain];

    var path = paths[Math.floor(Math.random() * paths.length)];
    var url = urlOf(path);

    var p = pos || (wr.cameraWorldPos || { x: 0, y: 0, z: 0 });
    var vol = (typeof volume === 'number' && volume > 0) ? Math.min(volume, 4) : 1;
    var pt = (typeof pitch === 'number' && pitch > 0) ? pitch : 1;
    // mineflayer pitch 是 63 进制（0~63），转成 1 附近

  // ---------- 3. 接线 ----------
  function hookBot() {
    var av = window.appViewer;
    // ★q19: globalThis.bot 才是真正收包的实例；appViewer 上的 bot 可能不是同一个。
    //        三个候选全部尝试挂载，各自去重，避免"挂错对象后永不重试"。
    var cands = [];

   - 每骨让位检测：|cur - lastWrite| > 0.03 → bundle 正在动该骨 → 本帧不写，
     rx 同步为 cur；bundle 动画停下复位后 rx 自动回 default；
   - 只写 rotation.x，绝不碰 position（v6 骨头脱离教训）；删除 head/body 附加动作；
   - 幅度原版化：行走 腿±0.5/臂±0.42，奔跑(mv>0.55)×1.9，四足 leg 对角±0.45；
   - idle(mv≤0.02) 只写 rx 归位（严格 default 姿势，无微抽）；
   - 拉弓：持弓臂 -1.5rad（+z 前向=负值前摆，_hum4 实证），平滑过渡。 */
(function(){
  var W = window;
  function emTable(){
    try{
      var w = W.world;
      if (w && w.entities && w.entities.entities) return w.entities.entities;
      if (W.__wb && W.__wb.entities && W.__wb.entities.entities) return W.__wb.entities.entities;
      if (W.entities && W.entities.entities) return W.entities.entities;
    }catch(e){}
    return null;
  }
  var DEFS = new WeakMap(); // wrapper -> {legs,arms,last,ph,bowK,bowT,bow,holdArm,hum}
  var ready = false, frames = 0, mobs = 0, err = 0;
  W.__qAnim = {v:11, frames:0, mobs:0, hums:0, walk:0, idle:0, bow:0, yield:0, err:0};

  function findBones(w){
    var legs = [], arms = [], holdArm = null;
    w.traverse(function(o){
      if (!o.name || o.name.indexOf('bone_') !== 0) return;
      var n = o.name.slice(5);
      if (/^leg\d$/.test(n)) legs.push({b:o, n:n});
      else if (n === 'leftLeg' || n === 'rightLeg') legs.push({b:o, n:n});
      else if (n === 'leftArm' || n === 'rightArm') arms.push({b:o, n:n});
      else if (n === 'leftItem' || n === 'rightItem'){
        var has = false;
        o.traverse(function(c){ if (c.name && c.name.indexOf('custom_item') === 0) has = true; });
        if (has) holdArm = (n === 'leftItem' ? 'leftArm' : 'rightArm');
      }
    });
    return {legs:legs, arms:arms, holdArm:holdArm};
  }
  function capture(d, g){
    d.legs = g.legs.map(function(l){ return {b:l.b, n:l.n, rx:l.b.rotation.x, lw:l.b.rotation.x}; });
    d.arms = g.arms.map(function(l){ return {b:l.b, n:l.n, rx:l.b.rotation.x, lw:l.b.rotation.x}; });
    d.holdArm = g.holdArm;
    d.hum = g.arms.length > 0;
  }
  function hasBow(oe){
    try{
      var eq = oe.equipment;
      if (eq && eq[0] && eq[0].name && /bow/i.test(eq[0].name)) return true;
      var h = oe.heldItem;
      if (h && h.name && /bow/i.test(h.name)) return true;
    }catch(e){}
    return false;
  }
  function clamp(v, base){ return v > base + 1.3 ? base + 1.3 : (v < base - 1.3 ? base - 1.3 : v); }
  function tick(){
    frames++;
    try{
      var T = emTable();
      if (!T) return;
      var now = performance.now();
      for (var k in T){
        var w = T[k];
        if (!w || !w.originalEntity || !w.position) continue;
        var oe = w.originalEntity;
        if (oe.name === 'player' || oe.type === 'player') continue;
        var d = DEFS.get(w);
        if (d === undefined){
          var g = findBones(w);
          if (!g.legs.length) { DEFS.set(w, null); continue; }
          d = {legs:null, arms:null, last:null, ph:Math.random()*6.28, mvE:0, bowK:0, bowT:0, bow:false, holdArm:null, hum:false};
          capture(d, g);
          if (!d.legs.length) { DEFS.set(w, null); continue; }
          DEFS.set(w, d);
          mobs++;
          if (d.hum) W.__qAnim.hums++;
          continue;                                    // 首帧只采样 default，不写
        }
        if (!d) continue;
        var dt = d.last ? Math.min(0.1, (now - d.last.t) / 1000) : 0;
        var px = w.position.x, pz = w.position.z;
        var sp = d.last ? Math.hypot(px - d.last.x, pz - d.last.z) / Math.max(0.001, dt) : 0;
        d.last = {x:px, z:pz, t:now};
        var mv = Math.min(1, sp / 0.5);          // v11: 原版幅度——僵尸 0.35m/s -> mv=0.7 -> 臂 +-0.52rad(29度可见）
        d.mvE = d.mvE * 0.7 + mv * 0.3;          // v10: EMA 平滑，防 tp/瞬移假速单帧爆幅
        mv = d.mvE;
        var run = mv > 0.55 ? 1.9 : 1;
        if (mv > 0.02){ d.ph += dt * (5 + 7 * mv) * mv; W.__qAnim.walk++; }
        else { d.ph += dt * 0.6; W.__qAnim.idle++; }
        var sw = Math.sin(d.ph) * 0.85 * mv * run;   // v11: 腿 0.5->0.85 原版幅度
        var aw = Math.sin(d.ph) * 0.75 * mv * run;   // v11: 臂 0.42->0.75 原版幅度
        for (var i = 0; i < d.legs.length; i++){
          var L = d.legs[i];
          var cur = L.b.rotation.x;
          if (Math.abs(cur - L.lw) > 0.03){ L.rx = cur; L.lw = cur; W.__qAnim.yield++; continue; }  // bundle 让位
          var s;
          if (/^leg\d$/.test(L.n)) s = (parseInt(L.n.slice(3), 10) % 2) === 1 ? -sw : sw;   // 四足对角
          else s = (L.n === 'rightLeg') ? sw : -sw;                                          // 人形对角
          var nv = mv > 0.02 ? clamp(L.rx + s, L.rx) : L.rx;
          L.b.rotation.x = nv; L.lw = nv;
        }
        if (d.hum){
          d.bowT++;
          if (d.bowT % 30 === 1) d.bow = !!d.holdArm && hasBow(oe);
          var want = d.bow ? 1 : 0;
          d.bowK += (want - d.bowK) * Math.min(1, dt * 8);
          if (d.bowK > 0.02) W.__qAnim.bow++;
          for (var j = 0; j < d.arms.length; j++){
            var A = d.arms[j];
            var cur2 = A.b.rotation.x;
            if (Math.abs(cur2 - A.lw) > 0.03){ A.rx = cur2; A.lw = cur2; W.__qAnim.yield++; continue; }  // bundle 让位
            var nv2;
            if (d.bowK > 0.03 && A.n === d.holdArm){
              nv2 = A.rx - d.bowK * 1.5;
            } else {
              nv2 = mv > 0.02 ? clamp(A.rx + (A.n === 'rightArm' ? -aw : aw), A.rx) : A.rx;
            }
            A.b.rotation.x = nv2; A.lw = nv2;
          }
        }
      }
    }catch(e){ err++; W.__qAnim.err = err; if(err<=2){ try{ console.warn('q11err:', e && e.message); }catch(_){} } }
    W.__qAnim.frames = frames; W.__qAnim.mobs = mobs;
  }
  var boot = setInterval(function(){
    try{
      var w = W.world;
      if (w && w.scene && !w.scene.__q11){
        w.scene.__q11 = 1; ready = 1;
        var prev = w.scene.onAfterRender;               // 链式保留 bundle 可能已有的回调
        w.scene.onAfterRender = function(r, s, c){
          if (typeof prev === 'function') { try { prev(r, s, c); } catch(e){} }
          tick();
        };
        clearInterval(boot);
      }
    }catch(e){}
  }, 500);
  setTimeout(function(){ clearInterval(boot); }, 150000);
})();

</script>
<script>
/* bubble-particles v7：原版气泡柱粒子 + 气泡柱环境音（v5 2026-10-25 挂载修正）
   v4 死因（_diag8 实证 renderer.info.render.calls=2 恒定）：bundle 的 worldRenderer.render()
   是手动调用各子系统 .render()，不走 three scene.traverse —— 直接 sc.add() 的裸 mesh
   永远不进渲染管线（spawned/sphere 计数正常但肉眼不可见）。
   v5：照 waypoints 同款官方路径——独立 bubbleScene + worldRenderer.onRender.push(pass)，
   pass 内 renderer.autoClear=false → renderer.render(bubbleScene, camera) → 恢复。
   （waypoints.render() = renderer.render(waypointScene, camera) 即 bundle 自身用法。）
   保留 v4：depthTest=false 穿透 bundle 不透明水面；粒径 0.12；限流 10。 */
(function(){
  var items=[], geo=null, mat=null, MAX=220, err=0, cols=0;
  window.__bubble={v:7, n:0, spawned:0, cols:0, err:0, inCol:0, colType:'', sndN:0, fbN:0};
  function ensure(){
    if(geo||!globalThis.THREE) return !!geo;
    try{
      geo=new THREE.SphereGeometry(0.12,8,8);
      mat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.85,depthWrite:false,depthTest:false});
    }catch(e){}
    return !!geo;
  }
  function wr(){ try{ return window.appViewer&&window.appViewer.backend&&window.appViewer.backend.soundSystem&&window.appViewer.backend.soundSystem.worldRenderer||null; }catch(e){ return null; } }
  function bscene(){
    try{
      var W=wr(); if(!W) return null;
      if(!W.__bubbleScene){ W.__bubbleScene=new (globalThis.THREE.Scene)(); }
      return W.__bubbleScene;
    }catch(e){ return null; }
  }
  function spawn(x,y,z,up,dist){
    try{
      if(!ensure()) return;
      var sc=bscene(); if(!sc) return;
      if(items.length>=MAX){ var old=items.shift(); if(old.m.parent) old.m.parent.remove(old.m); }
      var m=new THREE.Mesh(geo,mat);
      m.renderOrder=999;
      m.frustumCulled=false;          // v7：气泡柱必现，防相机矩阵/朝向边缘情况被剔除
      sc.add(m);
      var life=Math.max(700, dist/1.2*1000*1.25+250)+Math.random()*300;
      items.push({m:m, ax:x+(Math.random()-0.5)*0.25, ay:y, az:z+(Math.random()-0.5)*0.25, vy:up?1.2:-1.2, born:performance.now(), life:life});
      window.__bubble.spawned++;
    }catch(e){ err++; }
  }
  function blockAtSafe(b, base, x, y, z){ try { return b.blockAt ? b.blockAt(new base(x,y,z)) : null; } catch(e){ return null; } }
  /* 柱型：'up'=涌流(灵魂沙,气泡上升) / 'down'=涡流(岩浆块,气泡下沉)。
     优先 blockstate.drag（drag=true 即向下拖），取不到则向下走 14 格找源头块。 */
  function colType(b, base, x, y, z, prDrag){
    if(prDrag!=null) return prDrag?'down':'up';
    for(var i=0;i<14;i++){
      var blk=blockAtSafe(b, base, x, y-i, z);
      if(!blk) break;
      if(blk.name==='bubble_column') continue;
      if(blk.name==='magma_block') return 'down';
      if(blk.name==='soul_sand') return 'up';
      break;
    }
    return 'up';
  }
  /* 原版主路：方块柱扫描（覆盖站在柱内/柱旁/柱上水面） */
  function scanColumns(){
    try{
      var b=globalThis.bot; if(!b||!b.entity||!b.entity.position) return;
      var bp=b.entity.position, base=bp.constructor||null;
      var blockAt=b.blockAt?b.blockAt.bind(b):(b.world&&b.world.getBlock?b.world.getBlock.bind(b.world):null);
      if(!blockAt||!base) return;
      cols=0; var made=0;
      var px=Math.floor(bp.x), py=Math.floor(bp.y), pz=Math.floor(bp.z);
      for(var dx=-6;dx<=6&&made<10;dx++)for(var dz=-6;dz<=6&&made<10;dz++){
        var cx=px+dx, cz=pz+dz, found=-1, prDrag=null, hasCol=false;
        for(var yy=py+1;yy>=py-5;yy--){
          var blk=blockAtSafe(b, base, cx, yy, cz);
          if(blk&&blk.name==='bubble_column'){
            found=yy; hasCol=true;
            try{ var pr=blk.getProperties?blk.getProperties():{}; if(pr&&pr.drag!=null) prDrag=!!pr.drag; }catch(e){}
            break;
          }
        }
        if(!hasCol) continue;
        cols++;
        var up=(colType(b, base, cx, found, cz, prDrag)==='up');
        var top=found+1, guard=0;
        while(guard++<16){
          var ab=blockAtSafe(b, base, cx, top, cz);
          if(!ab||(ab.name!=='water'&&ab.name!=='bubble_column')) break;
          top++;
        }
        if(Math.random()<0.6){
          var h=up?(found+0.1+Math.random()*Math.max(0.3,top-found-0.2))
                  :(found+0.2+Math.random()*Math.min(3,Math.max(0.5,top-found-0.3)));
          var dist=up?(top-h):(h-found);
          spawn(cx+0.5, h, cz+0.5, up, dist);
          made++;
        }
      }
      window.__bubble.cols=cols;
    }catch(e){ err++; }
  }
  setInterval(scanColumns, 450);
  /* 辅路：服务端 bubble 包（字段：position/offset 为 Vec3，id 可为字符串或数字） */
  function hook(b){
    if(b.__bubbleHooked) return; b.__bubbleHooked=1;
    b.on('particle', function(p){
      try{
        if(!p) return;
        var pid=p.id;
        var isBub=(typeof pid==='string'&&pid.indexOf('bubble')!==-1)||(p.name&&String(p.name).indexOf('bubble')!==-1);
        if(!isBub) return;
        var pos=p.position||p, off=p.offset||{};
        var up=((off.y!=null?off.y:0)>=0);
        var n=Math.min(6, p.count||4);
        for(var i=0;i<n;i++) spawn(pos.x, pos.y+Math.random()*0.25, pos.z, up, 1.5);
      }catch(e){ err++; }
    });
  }
  var t=setInterval(function(){ if(window.bot){ clearInterval(t); hook(window.bot); } },500);
  setTimeout(function(){ clearInterval(t); },120000);

  /* ===== v5 渲染 pass：挂 worldRenderer.onRender（waypoints 同款官方路径） ===== */
  var lastT=performance.now(), passOn=0;
  function pass(){
    try{
      var W2=wr();
      var now=performance.now(), dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
      var so=W2&&W2.sceneOrigin;
      for(var i=items.length-1;i>=0;i--){
        var it=items[i];
        if(so&&so.toSceneX){
          it.m.position.set(so.toSceneX(it.ax), so.toSceneY(it.ay), so.toSceneZ(it.az));
        }
        it.m.position.y+=it.vy*dt;
        it.m.position.x+=Math.sin(now/700+it.born)*0.04*dt*10;   // 极慢横向漂移
        if(now-it.born>it.life){ if(it.m.parent) it.m.parent.remove(it.m); items.splice(i,1); }
      }
      window.__bubble.n=items.length; window.__bubble.err=err;
      if(items.length){
        if(!W2||!W2.renderer||!W2.camera) return;
        var sc=W2.__bubbleScene; if(!sc) return;
        var ac=W2.renderer.autoClear;
        try{ W2.camera.updateMatrixWorld(); }catch(e){}
        W2.renderer.autoClear=false;
        W2.renderer.render(sc, W2.camera);
        W2.renderer.autoClear=ac;
      }
    }catch(e){ err++; window.__bubble.err=err; }
  }
  var boot=setInterval(function(){
    var W=wr();
    if(W&&W.onRender&&!passOn){
      passOn=1;
      W.onRender.push(pass);
      clearInterval(boot);
    }
  },500);
  setTimeout(function(){ clearInterval(boot); },150000);

  /* ===== 气泡柱原版环境音（仅轴内触发；上浮/下沉不同） ===== */
  var S={cur:'',lastAmb:0};
  function sndPlay(name, vol){
    try{
      var SB=window.__soundBridge;
      if(SB&&SB.playAt){ if(SB.playAt(name, null, vol, 0.9+Math.random()*0.2)){ window.__bubble.sndN++; return true; } }
    }catch(e){}
    try{
      var f=name.replace(/^minecraft:/,'').replace(/\./g,'/');
      if(/ambient$/.test(f)){ var mx=(f.indexOf('whirlpool')!==-1)?3:5; f+=(1+Math.floor(Math.random()*mx)); }
      var a=new Audio('/sounds/minecraft/sounds/'+f+'.mp3');
      a.volume=Math.min(0.7, vol||0.4);
      a.playbackRate=0.9+Math.random()*0.2;
      var pr=a.play(); if(pr&&pr.catch)pr.catch(function(){});
      window.__bubble.fbN++;
    }catch(e2){}
    return false;
  }
  function inColumn(){
    try{
      var b=globalThis.bot; if(!b||!b.entity||!b.entity.position) return null;
      var bp=b.entity.position, base=bp.constructor||null;
      if(!b.blockAt||!base) return null;
      var px=Math.floor(bp.x), py=Math.floor(bp.y), pz=Math.floor(bp.z);
      for(var dy=0;dy<=1;dy++){
        var blk=blockAtSafe(b, base, px, py+dy, pz);
        if(blk&&blk.name==='bubble_column'){
          var prDrag=null;
          try{ var pr=blk.getProperties?blk.getProperties():{}; if(pr&&pr.drag!=null) prDrag=!!pr.drag; }catch(e){}
          return colType(b, base, px, py+dy, pz, prDrag);
        }
      }
      return null;
    }catch(e){ return null; }
  }
  setInterval(function(){
    try{
      var t2=inColumn(), now=Date.now();
      if(t2){
        window.__bubble.inCol=1; window.__bubble.colType=t2;
        if(S.cur!==t2){ S.cur=t2; sndPlay(t2==='up'?'minecraft:block.bubble_column.upwards_inside':'minecraft:block.bubble_column.whirlpool_inside', 0.7); }
        else if(now-(S.lastAmb||0)>2200+Math.random()*1800){
          S.lastAmb=now;
          sndPlay(t2==='up'?'minecraft:block.bubble_column.upwards_ambient':'minecraft:block.bubble_column.whirlpool_ambient', 0.32);
        }
      }else{
        window.__bubble.inCol=0; window.__bubble.colType='';
        if(S.cur){ S.cur=''; S.lastAmb=0; }
      }
    }catch(e){ err++; }
  },400);
})();
</script>



<script>
/* perf-guard v1：低配自动降档（Alec 10-25："整体卡，优化客户端/网络/服务端，别优化我电脑"）
   ① WebGL 软件渲染检测（SwiftShader/llvmpipe/软件光栅）→ 立即降有效渲染距离 + 降像素比
      （动态分辨率：软件渲染下片段开销减半以上；DOM UI 不受影响）
   ② 帧时看门狗：2s 窗均帧 >45ms 且当前有效距离 >3 → 逐级降（0.7 步进，下限 3），只降不升
   ③ 与 bundle 原生 autoLowerRenderDistance（25ms/0.8 步进）互补：同一字段，双方都只写小值
   ④ 纯 console 诊断，零 UI（webmc 铁律 0）；window.__perf 可手动查询 */
(function(){
  var P = window.__perf = { v:1, soft:0, rd:0, base:0, fps:0, drops:0, pxr:0, err:0, ready:0 };
  function log(){ try{ console.log.apply(console, arguments); }catch(e){} }
  function wr(){ try{ var av=window.appViewer; return av&&av.backend&&av.backend.soundSystem&&av.backend.soundSystem.worldRenderer||null; }catch(e){ return null; } }
  function cmm(){ var w=wr(); return w&&w.chunkMeshManager||null; }
  function effRd(){ var c=cmm(); if(!c) return 0; return c.performanceOverrideDistance||w_viewDistance(); }
  function w_viewDistance(){ var w=wr(); return (w&&w.viewDistance)||10; }

  /* ---- ① 软件渲染检测：优先复用现存上下文，失败才开一次性画布 ---- */
  function glInfo(){
    try{
      var av=window.appViewer, r=null;
      if(av&&av.renderer&&typeof av.renderer.getContext==='function') r=av.renderer;
      var w=wr(); if(!r&&w&&w.renderer&&typeof w.renderer.getContext==='function') r=w.renderer;
      var gl=r?r.getContext():null;
      if(!gl){ var cv=document.createElement('canvas'); gl=cv.getContext('webgl2')||cv.getContext('webgl'); }
      if(!gl) return null;
      var ext=null; try{ ext=gl.getExtension('WEBGL_debug_renderer_info'); }catch(e){}
      var s=ext?(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||''):(gl.getParameter(gl.RENDERER)||'');
      return String(s);
    }catch(e){ P.err++; return null; }
  }
  function isSoft(s){ return /swiftshader|llvmpipe|software|basic render|microsoft basic/i.test(s||''); }

  function applyOverride(v, why){
    var c=cmm(); if(!c) return;
    var cur=c.performanceOverrideDistance||w_viewDistance();
    if(v>=cur) return;                       // 只降不升
    c.performanceOverrideDistance=v;
    P.drops++; P.rd=v;
    log('[perf] render distance %d -> %d (%s)', cur, v, why);
  }

  var boot=setInterval(function(){
    var c=cmm(); if(!c) return;
    clearInterval(boot); P.ready=1; P.base=w_viewDistance(); P.rd=effRd();
    var info=glInfo();
    log('[perf] GL renderer: '+(info||'unknown')+' | viewDistance='+P.base+' | eff='+P.rd);
    if(info&&isSoft(info)){
      P.soft=1;
      var target=Math.max(4, Math.min(5, P.base-4));
      applyOverride(target, 'software GL');
      /* 动态分辨率：找得到 THREE renderer 才降像素比 */
      try{
        var av=window.appViewer, r=(av&&av.renderer&&typeof av.renderer.setPixelRatio==='function')?av.renderer:null;
        var w=wr(); if(!r&&w&&w.renderer&&typeof w.renderer.setPixelRatio==='function') r=w.renderer;
        if(r){
          var cur=typeof r.getPixelRatio==='function'?r.getPixelRatio():1;
          if(cur>0.7){ r.setPixelRatio(0.7); P.pxr=0.7; log('[perf] pixelRatio %.2f -> 0.70 (software GL dynamic res)', cur);
            window.addEventListener('resize', function(){ try{ if(P.soft&&typeof r.getPixelRatio==='function'&&r.getPixelRatio()>0.7) r.setPixelRatio(0.7); }catch(e){} }); }
        }
      }catch(e){ P.err++; }
    }
  },1000);
  setTimeout(function(){ clearInterval(boot); },120000);

  /* ---- ② 帧时看门狗 ---- */
  var last=performance.now(), acc=0, n=0, chk=performance.now(), bad=0;
  function frame(){
    requestAnimationFrame(frame);
    try{
      var now=performance.now(), dt=now-last; last=now;
      if(dt>0&&dt<2000){ acc+=dt; n++; }
      if(now-chk>=2000){
        if(n){ P.fps=Math.round(1000/(acc/n)); }
        var avg=n?acc/n:0;
        if(avg>45){ bad++; } else { bad=0; }
        if(bad>=3){                            // 连续 6s 都 >45ms（<22fps）
          var cur=effRd();
          if(cur>3){ applyOverride(Math.max(3, Math.floor(cur*0.7)), 'sustained '+Math.round(avg)+'ms frames'); }
          bad=0;
        }
        acc=0; n=0; chk=now;
      }
    }catch(e){ P.err++; }
  }
  requestAnimationFrame(frame);
  /* perfsum：每分钟一行 console 摘要——Alec 真机卡顿时 F12 看最后几行即可归因
     （铁律0：只进 console，零 UI）。heap 线性不回落=泄漏；fps 低=渲染；ent 暴涨=实体。 */
  setInterval(function(){
    try{
      var ent=0;
      try{ var w=window.world; ent=w&&w.entities&&w.entities.entities?Object.keys(w.entities.entities).length:0; }catch(e){}
      var q=globalThis.__qAnim||{}, bb=globalThis.__bubble||{}, it=globalThis.__itemFix||{};
      log('[perf] fps='+P.fps+' rd='+P.rd+' soft='+P.soft+' heap='+(performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576):-1)+'MB ent='+ent+' anim='+q.frames+'(w'+q.walk+'/i'+q.idle+'/y'+q.yield+') bub='+bb.n+'/'+bb.spawned+' itemfix='+(it.cleared||0));
    }catch(e){ P.err++; }
  }, 60000);
  log('[perf] guard v1 armed (auto software-detect + frame watchdog + perfsum)');
})();
</script>
